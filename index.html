<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧪 Lab — مشاريع تجريبية</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0f;
      color: #e8e8f0;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
      border-bottom: 1px solid #1e1e2e;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin-top: 10px;
      color: #6b7280;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 50px auto;
      padding: 0 24px;
    }

    .card {
      background: #13131a;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card:hover {
      border-color: #a78bfa55;
      transform: translateY(-4px);
      box-shadow: 0 12px 32px #a78bfa18;
    }

    .card-icon { font-size: 2.2rem; }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f0f0ff;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #6b7280;
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: #1e1e2e;
      color: #a78bfa;
      margin-top: auto;
      width: fit-content;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #374151;
      font-size: 0.8rem;
      border-top: 1px solid #1e1e2e;
      margin-top: 40px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #374151;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧪 Lab</h1>
    <p>مشاريع HTML تجريبية — كل شيء هنا صُنع للمتعة</p>
  </header>

  <main class="grid" id="projects">
    <h2>ملف 2</h2>

    <a href="fake-site/" class="card">
      <div class="card-icon">🏢</div>
      <div class="card-title">موقع الشركة المزيف</div>
      <div class="card-desc">نموذج موقع شركة تجريبي للمتعة.</div>
      <div class="tag">fake-site</div>
    </a>
  </main>

  <footer>
    ALWAQAD-afk · Lab · مفتوح المصدر وللتسلية فقط
  </footer>

</body>
</html>
